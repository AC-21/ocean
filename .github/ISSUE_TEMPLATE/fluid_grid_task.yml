name: Fluid grid task
description: Track WebGPU fluid-grid remap work.
title: "FG-XX-TXX: "
labels:
  - fluid-grid
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Use FG-00 through FG-06.
      placeholder: FG-01
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - architecture
        - capability
        - compute
        - renderer
        - physics
        - calibration
        - verification
        - repo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What realism, performance, or tracking gap does this close?
    validations:
      required: true
  - type: textarea
    id: exit-proof
    attributes:
      label: Exit proof
      description: Name the command, report, screenshot, or artifact that proves completion.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, references, and follow-up risk.
