<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Impact Lab</title>
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <style>
      .boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #0d1717;
        color: #f8fbf7;
        font: 900 14px/1.2 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      .boot-screen span {
        display: grid;
        gap: 6px;
        text-align: center;
      }

      .boot-screen b {
        font-size: 24px;
      }

      .boot-screen small {
        color: #93d4dc;
        font-size: 11px;
        text-transform: uppercase;
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" data-testid="boot-screen">
        <span><b>Ocean Impact Lab</b><small>Loading physics model</small></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
